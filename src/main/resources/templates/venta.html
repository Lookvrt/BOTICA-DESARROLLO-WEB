<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punto de Venta - Ahorro y Salud</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="d-flex">
    <div th:replace="~{fragment/sidebar :: sidebar('venta')}"></div>

    <main class="flex-grow-1 p-4 overflow-auto min-vh-100">

        <h3 class="mb-4 fw-semibold">Punto de Venta</h3>

        <div class="row g-4">

            <div class="col-12 col-lg-7 d-flex flex-column">
                <div class="card border border-light-subtle p-4 shadow-sm bg-white rounded-3 flex-grow-1">

                    <div class="d-flex gap-3 mb-4">
                        <div class="input-group flex-grow-1">
                            <span class="input-group-text bg-white text-muted border-end-0" id="search-icon">
                                <i class="bi bi-search"></i>
                            </span>
                            <input type="text" class="form-control border-start-0 ps-0 shadow-none" placeholder="Producto" aria-label="Producto" aria-describedby="search-icon">
                        </div>
                        <button class="btn btn-light border px-4 fw-semibold text-secondary">Buscar</button>
                    </div>

                    <div class="table-responsive">
                        <table class="table align-middle">
                            <thead>
                            <tr class="text-secondary">
                                <th class="fw-normal border-bottom-2">Nombre</th>
                                <th class="fw-normal border-bottom-2 text-center">Stock</th>
                                <th class="fw-normal border-bottom-2 text-center">Precio</th>
                                <th class="border-bottom-2"></th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr>
                                <td class="fw-bold">Paracetamol 500mg x10</td>
                                <td class="text-center">120</td>
                                <td class="text-center">2.50</td>
                                <td class="text-end">
                                    <button class="btn btn-sm bg-success bg-opacity-50 text-dark fw-medium border-0 px-3 rounded-2">
                                        + Añadir
                                    </button>
                                </td>
                            </tr>
                            <tr>
                                <td class="fw-bold">Amoxicilina 500mg x12</td>
                                <td class="text-center">5</td>
                                <td class="text-center">12.00</td>
                                <td class="text-end">
                                    <button class="btn btn-sm bg-success bg-opacity-50 text-dark fw-medium border-0 px-3 rounded-2">
                                        + Añadir
                                    </button>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                </div>
            </div>

            <div class="col-12 col-lg-5 d-flex flex-column">
                <div class="card border border-light-subtle p-3 p-md-4 shadow-sm bg-white rounded-3 flex-grow-1 d-flex flex-column gap-3">

                    <div class="p-3 rounded-3 flex-grow-1">
                        <h6 class="mb-3 fw-bold">Carrito</h6>

                        <div class="table-responsive">
                            <table class="table align-middle mb-0">
                                <thead>
                                <tr class="text-secondary">
                                    <th class="fw-normal border-bottom-2">Producto</th>
                                    <th class="fw-normal border-bottom-2 text-center">Cant</th>
                                    <th class="fw-normal border-bottom-2 text-end">Subtotal</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr>
                                    <td class="fw-bold">Paracetamol 500mg</td>
                                    <td class="text-center">2</td>
                                    <td class="text-end">5.00</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div class="p-3 rounded-3 mt-auto">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h6 class="mb-0 fw-bold">Total a pagar</h6>
                            <h5 class="mb-0 fw-bold">S/ 5.00</h5>
                        </div>

                        <div class="row g-2">
                            <div class="col-6">
                                <button class="btn w-100 py-2 fw-semibold bg-primary bg-opacity-25 text-dark border-0 rounded-2">
                                    Cobrar
                                </button>
                            </div>
                            <div class="col-6">
                                <button class="btn w-100 py-2 fw-semibold bg-danger bg-opacity-25 text-dark border-0 rounded-2">
                                    Cancelar
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
