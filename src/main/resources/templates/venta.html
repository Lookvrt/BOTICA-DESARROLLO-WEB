<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragment/head :: common-head('Punto de Venta - Ahorro y Salud')}">
</head>
<body class="bg-light">

<!-- Token CSRF para las peticiones POST desde venta.js -->
<input type="hidden" id="csrf-token" th:if="${_csrf}" th:value="${_csrf.token}" th:attr="data-header=${_csrf.headerName}"/>

<div class="d-flex">
    <div th:replace="~{fragment/sidebar :: sidebar('venta')}"></div>

    <main class="flex-grow-1 p-4 overflow-auto min-vh-100" style="margin-left: 260px;">

        <h3 class="mb-4 fw-semibold">Punto de Venta</h3>

        <div id="alerta-venta" class="alert d-none" role="alert"></div>

        <div class="row g-4">

            <div class="col-12 col-lg-7 d-flex flex-column">
                <div class="card border border-light-subtle p-4 shadow-sm bg-white rounded-3 flex-grow-1">

                    <form id="form-buscar" class="d-flex gap-3 mb-4" autocomplete="off">
                        <div class="input-group flex-grow-1">
                            <span class="input-group-text bg-white text-muted border-end-0" id="search-icon">
                                <i class="bi bi-search"></i>
                            </span>
                            <input type="text" id="input-buscar" class="form-control border-start-0 ps-0 shadow-none"
                                   placeholder="Producto, código o principio activo" aria-label="Producto"
                                   aria-describedby="search-icon" autofocus>
                        </div>
                        <button type="submit" class="btn btn-light border px-4 fw-semibold text-secondary">Buscar</button>
                    </form>

                    <div class="table-responsive">
                        <table class="table align-middle">
                            <thead>
                            <tr class="text-secondary">
                                <th class="fw-normal border-bottom-2">Nombre</th>
                                <th class="fw-normal border-bottom-2 text-center">Stock</th>
                                <th class="fw-normal border-bottom-2 text-center">Precio</th>
                                <th class="border-bottom-2"></th>
                            </tr>
                            </thead>
                            <tbody id="tabla-resultados">
                            <tr>
                                <td colspan="4" class="text-center text-secondary py-4">
                                    Escribe el nombre, código o principio activo de un producto.
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                </div>
            </div>

            <div class="col-12 col-lg-5 d-flex flex-column">
                <div class="card border border-light-subtle p-3 p-md-4 shadow-sm bg-white rounded-3 flex-grow-1 d-flex flex-column gap-3">

                    <div class="p-3 rounded-3 flex-grow-1">
                        <h6 class="mb-3 fw-bold">Carrito</h6>

                        <div class="table-responsive">
                            <table class="table align-middle mb-0">
                                <thead>
                                <tr class="text-secondary">
                                    <th class="fw-normal border-bottom-2">Producto</th>
                                    <th class="fw-normal border-bottom-2 text-center">Cant</th>
                                    <th class="fw-normal border-bottom-2 text-end">Subtotal</th>
                                    <th class="border-bottom-2"></th>
                                </tr>
                                </thead>
                                <tbody id="tabla-carrito">
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div class="p-3 rounded-3 mt-auto">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h6 class="mb-0 fw-bold">Total a pagar</h6>
                            <h5 class="mb-0 fw-bold" id="total-pagar">S/ 0.00</h5>
                        </div>

                        <div class="mb-3">
                            <label for="metodo-pago" class="form-label small text-secondary mb-1">Método de pago</label>
                            <select id="metodo-pago" class="form-select">
                                <option th:each="m : ${metodosPago}" th:value="${m.name()}" th:text="${m.descripcion}">Efectivo</option>
                            </select>
                        </div>

                        <div class="row g-2 mb-3" id="bloque-efectivo">
                            <div class="col-6">
                                <label for="monto-recibido" class="form-label small text-secondary mb-1">Monto recibido</label>
                                <input type="number" id="monto-recibido" class="form-control" min="0" step="0.10" placeholder="0.00">
                            </div>
                            <div class="col-6">
                                <label class="form-label small text-secondary mb-1">Vuelto</label>
                                <div class="form-control bg-light fw-semibold" id="vuelto">S/ 0.00</div>
                            </div>
                        </div>

                        <div class="row g-2">
                            <div class="col-6">
                                <button type="button" id="btn-cobrar"
                                        class="btn w-100 py-2 fw-semibold bg-primary bg-opacity-25 text-dark border-0 rounded-2">
                                    Cobrar
                                </button>
                            </div>
                            <div class="col-6">
                                <button type="button" id="btn-cancelar"
                                        class="btn w-100 py-2 fw-semibold bg-danger bg-opacity-25 text-dark border-0 rounded-2">
                                    Cancelar
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<!-- Modal de venta registrada -->
<div class="modal fade" id="modal-venta-ok" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <div class="modal-body text-center p-4">
                <i class="bi bi-check-circle-fill text-success" style="font-size: 3rem;"></i>
                <h5 class="fw-bold mt-3">Venta registrada</h5>
                <p class="text-secondary mb-1">Comprobante <span class="fw-semibold text-dark" id="ok-comprobante"></span></p>
                <p class="text-secondary mb-1">Total: <span class="fw-semibold text-dark" id="ok-total"></span></p>
                <p class="text-secondary mb-1">Pago: <span class="fw-semibold text-dark" id="ok-metodo"></span></p>
                <p class="text-secondary mb-0 d-none" id="ok-vuelto-linea">Vuelto: <span class="fw-semibold text-dark" id="ok-vuelto"></span></p>
            </div>
            <div class="modal-footer border-0 justify-content-center pt-0 pb-4">
                <button type="button" class="btn btn-primary px-4" data-bs-dismiss="modal">Nueva venta</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script th:src="@{/js/venta.js}"></script>
</body>
</html>
