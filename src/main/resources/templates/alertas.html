<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alertas - Ahorro y Salud</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="d-flex">
    <div th:replace="~{fragment/sidebar :: sidebar('alertas')}"></div>

    <main class="flex-grow-1 p-4 overflow-auto min-vh-100">

        <h3 class="mb-4 fw-semibold">Stock minimo</h3>

        <div class="card border border-light-subtle p-4 shadow-sm bg-white rounded-3">

            <div class="mb-3">
                <span class="fw-medium text-dark">12 productos en alerta</span>
            </div>

            <div class="row g-2 mb-3 pb-3 border-bottom align-items-center">
                <div class="col-12 col-md-4 col-lg-5">
                    <div class="input-group">
                        <span class="input-group-text bg-white text-muted border-end-0" id="search-alert">
                            <i class="bi bi-search"></i>
                        </span>
                        <input type="text" class="form-control border-start-0 ps-0 shadow-none" placeholder="Busca por producto..." aria-label="Buscar producto" aria-describedby="search-alert">
                    </div>
                </div>

                <div class="col-12 col-md-8 col-lg-7 d-flex flex-wrap gap-2 justify-content-md-end align-items-center">
                    <button class="btn bg-secondary bg-opacity-10 border-0 text-dark d-flex align-items-center gap-2 px-3 fw-medium">
                        <i class="bi bi-filter"></i> Filtrar
                    </button>
                    <button class="btn bg-danger bg-opacity-50 border-0 text-dark d-flex align-items-center gap-2 px-3 fw-medium">
                        <i class="bi bi-file-earmark-pdf-fill text-danger"></i> PDF
                    </button>
                    <button class="btn bg-success bg-opacity-50 border-0 text-dark d-flex align-items-center gap-2 px-3 fw-medium">
                        <i class="bi bi-file-earmark-excel-fill text-success"></i> Excel
                    </button>
                    <button class="btn bg-primary bg-opacity-25 border-0 text-dark d-flex align-items-center gap-2 px-3 fw-medium">
                        <i class="bi bi-box-arrow-up-right"></i> Orden de compra para todos
                    </button>
                </div>
            </div>

            <div class="table-responsive min-vh-50 mt-3">
                <table class="table align-middle table-borderless table-hover">
                    <thead class="border-bottom">
                    <tr class="text-dark fw-semibold text-center">
                        <th class="py-3 text-start">Codigo</th>
                        <th class="py-3 text-start">Nombre</th>
                        <th class="py-3">P.activo</th>
                        <th class="py-3">Stock</th>
                        <th class="py-3">Minimo</th>
                        <th class="py-3">Diferencia</th>
                        <th class="py-3"></th>
                    </tr>
                    </thead>
                    <tbody class="text-center">
                    <tr class="border-bottom">
                        <td class="py-3 text-start">MED002</td>
                        <td class="text-start">Amoxicilina 500mg x12</td>
                        <td>Amoxicilina</td>
                        <td class="fw-medium">5</td>
                        <td>20</td>
                        <td>15</td>
                        <td class="text-end">
                            <button class="btn btn-sm bg-danger text-white bg-opacity-75 fw-medium border-0 px-3 py-2 rounded-2">
                                Orden Compra
                            </button>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div class="d-flex justify-content-center align-items-center gap-3 mt-5 pt-3 text-secondary">
                <a href="#" class="text-secondary text-decoration-none">&lt; Anterior</a>

                <div class="d-flex align-items-center gap-1">
                    <span class="bg-secondary bg-opacity-25 px-2 py-1 rounded text-dark fw-medium">1</span>
                    <a href="#" class="text-dark text-decoration-none px-2 py-1">2</a>
                    <a href="#" class="text-dark text-decoration-none px-2 py-1">3</a>
                    <span class="px-2 py-1">...</span>
                </div>

                <a href="#" class="text-secondary text-decoration-none">Siguiente &gt;</a>
            </div>

        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
