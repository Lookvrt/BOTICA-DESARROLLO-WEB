<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragment/head :: common-head('Alertas - Ahorro y Salud')}">
</head>
<body class="bg-light">

<div class="d-flex">
    <div th:replace="~{fragment/sidebar :: sidebar('alertas')}"></div>

    <main class="flex-grow-1 p-4 overflow-auto min-vh-100" style="margin-left: 260px;">

        <h3 class="mb-4 fw-semibold">Stock minimo</h3>

        <div class="card border border-light-subtle p-4 shadow-sm bg-white rounded-3">

            <div class="mb-3">
                <span class="fw-medium text-dark"
                      th:text="${totalAlertas == 1 ? '1 producto en alerta' : totalAlertas + ' productos en alerta'}">0 productos en alerta</span>
            </div>

            <div class="row g-2 mb-3 pb-3 border-bottom align-items-center">
                <div class="col-12 col-md-4 col-lg-5">
                    <div class="input-group">
                        <span class="input-group-text bg-white text-muted border-end-0" id="search-alert">
                            <i class="bi bi-search"></i>
                        </span>
                        <input type="text" class="form-control border-start-0 ps-0 shadow-none" id="buscar-alerta" placeholder="Busca por producto..." aria-label="Buscar producto" aria-describedby="search-alert">
                    </div>
                </div>

                <div class="col-12 col-md-8 col-lg-7 d-flex flex-wrap gap-2 justify-content-md-end align-items-center">
                    <button type="button" id="btn-orden-todos" th:disabled="${#lists.isEmpty(items)}"
                            class="btn bg-primary bg-opacity-25 border-0 text-dark d-flex align-items-center gap-2 px-3 fw-medium"
                            title="Abre una nueva compra en Compras con todos los productos de la tabla">
                        <i class="bi bi-box-arrow-up-right"></i> Orden de compra para todos
                    </button>
                </div>
            </div>

            <div class="table-responsive min-vh-50 mt-3">
                <table class="table align-middle table-borderless table-hover">
                    <thead class="border-bottom">
                    <tr class="text-dark fw-semibold text-center">
                        <th class="py-3 text-start">Codigo</th>
                        <th class="py-3 text-start">Nombre</th>
                        <th class="py-3">P.activo</th>
                        <th class="py-3">Stock</th>
                        <th class="py-3">Minimo</th>
                        <th class="py-3">Diferencia</th>
                        <th class="py-3"></th>
                    </tr>
                    </thead>
                    <tbody class="text-center" id="tabla-alertas">
                    <tr class="border-bottom fila-alerta" th:each="item : ${items}"
                        th:attr="data-id=${item.producto.idProducto},data-busqueda=${#strings.toLowerCase(item.producto.codigo + ' ' + item.producto.nombre + ' ' + (item.producto.principioActivo ?: ''))}">
                        <td class="py-3 text-start" th:text="${item.producto.codigo}">MED002</td>
                        <td class="text-start" th:text="${item.producto.nombre}">Amoxicilina 500mg x12</td>
                        <td th:text="${item.producto.principioActivo ?: '-'}">Amoxicilina</td>
                        <td class="fw-medium" th:classappend="${item.stockVendible == 0} ? 'text-danger'"
                            th:text="${item.stockVendible}">5</td>
                        <td th:text="${item.producto.stockMinimo}">20</td>
                        <td class="text-danger fw-medium" th:text="${item.producto.stockMinimo - item.stockVendible}">15</td>
                        <td class="text-end">
                            <a th:href="@{/compras(alerta=${item.producto.idProducto})}"
                               title="Abre una nueva compra en Compras con este producto"
                               class="btn btn-sm bg-danger text-white bg-opacity-75 fw-medium border-0 px-3 py-2 rounded-2">
                                Orden Compra
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(items)}">
                        <td colspan="7" class="py-5 text-secondary">
                            <i class="bi bi-check-circle text-success me-1"></i>
                            Todos los productos están por encima de su stock mínimo.
                        </td>
                    </tr>
                    <tr id="sin-resultados" class="d-none">
                        <td colspan="7" class="py-5 text-secondary">Ningún producto coincide con la búsqueda.</td>
                    </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script>
    // Filtro en vivo de la tabla de alertas por código, nombre o principio activo
    document.getElementById('buscar-alerta').addEventListener('input', function () {
        const texto = this.value.trim().toLowerCase();
        let visibles = 0;
        document.querySelectorAll('.fila-alerta').forEach(fila => {
            const coincide = fila.dataset.busqueda.includes(texto);
            fila.classList.toggle('d-none', !coincide);
            if (coincide) visibles++;
        });
        const total = document.querySelectorAll('.fila-alerta').length;
        document.getElementById('sin-resultados').classList.toggle('d-none', total === 0 || visibles > 0);
        document.getElementById('btn-orden-todos').disabled = visibles === 0;
    });

    // "Orden de compra para todos": lleva a Compras con los productos visibles en la tabla
    document.getElementById('btn-orden-todos').addEventListener('click', function () {
        const ids = [...document.querySelectorAll('.fila-alerta:not(.d-none)')].map(f => f.dataset.id);
        if (ids.length > 0) {
            window.location.href = '/compras?alerta=' + ids.join(',');
        }
    });
</script>
</body>
</html>
