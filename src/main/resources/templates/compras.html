<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragment/head :: common-head('Compras - Ahorro y Salud')}">
</head>
<body class="bg-light">

<div class="d-flex">
    <div th:replace="~{fragment/sidebar :: sidebar('compras')}"></div>

    <main class="flex-grow-1 p-4 overflow-auto min-vh-100">

        <h3 class="mb-4 fw-semibold">Compras</h3>

        <div class="card border border-light-subtle p-4 shadow-sm bg-white rounded-3">

            <div class="d-flex justify-content-between align-items-center mb-3">
                <span class="fw-medium fs-5" th:text="|${#lists.size(compras)} compras|"></span>
                <button class="btn btn-light bg-white border px-3 fw-medium text-dark" data-bs-toggle="modal" data-bs-target="#nuevaCompra">
                    + Nuevo
                </button>
            </div>

            <div class="row g-2 mb-3 pb-3 border-bottom">
                <div class="col-12 col-md-5 col-lg-4">
                    <div class="input-group">
                        <span class="input-group-text bg-white text-muted border-end-0" id="search-compras">
                            <i class="bi bi-search"></i>
                        </span>
                        <input type="text" class="form-control border-start-0 ps-0 shadow-none" placeholder="Busca por proveedor..." aria-label="Buscar proveedor" aria-describedby="search-compras">
                    </div>
                </div>

                <div class="col-auto">
                    <button class="btn bg-secondary bg-opacity-10 border-0 text-dark d-flex align-items-center gap-2 px-3 fw-medium">
                        <i class="bi bi-calendar"></i> Fecha inicio
                    </button>
                </div>

                <div class="col-auto">
                    <button class="btn bg-secondary bg-opacity-10 border-0 text-dark d-flex align-items-center gap-2 px-3 fw-medium">
                        <i class="bi bi-calendar"></i> Fecha final
                    </button>
                </div>

                <div class="col-auto">
                    <button class="btn bg-secondary bg-opacity-10 border-0 text-dark d-flex align-items-center gap-2 px-3 fw-medium">
                        <i class="bi bi-filter"></i> Filtrar
                    </button>
                </div>
            </div>

            <div class="table-responsive min-vh-50">
                <table class="table align-middle table-borderless table-hover">
                    <thead class="border-bottom">
                    <tr class="text-dark fw-semibold">
                        <th class="py-3">Nro</th>
                        <th class="py-3">Fecha</th>
                        <th class="py-3">Proveedor</th>
                        <th class="py-3">Comprobante</th>
                        <th class="py-3">Total</th>
                        <th class="py-3"></th>
                    </tr>
                    </thead>
                    <tbody>
                        <tr th:each="c : ${compras}" th:if="${c.estado != null and c.estado.name() != 'ANULADA'}" class="border-bottom">
                            <td class="py-3" th:text="${c.idCompra}"></td>
                            <td th:text="${c.fechaCompra != null ? #temporals.format(c.fechaCompra, 'dd/MM/yyyy') : '-'}"></td>
                            <td th:text="${c.proveedor != null ? c.proveedor.razonSocial : '-'}"></td>
                            <td th:text="${(c.tipoComprobante ?: '') + '/' + (c.numeroComprobante ?: '')}"></td>
                            <td th:text="${#numbers.formatDecimal(c.total, 1, 2)}"></td>
                            <td class="text-end">
                                <a th:href="@{/compras/editar/{id}(id=${c.idCompra})}"
                                   class="btn btn-link text-dark p-1 text-decoration-none me-2" title="Editar compra">
                                    <i class="bi bi-pencil fs-5"></i>
                                </a>

                                <form th:action="@{/compras/anular/{id}(id=${c.idCompra})}" method="post" class="d-inline"
                                      onsubmit="return confirm('¿Deseas anular esta compra?');">
                                    <button type="submit" class="btn btn-link text-dark p-1 text-decoration-none" title="Anular compra">
                                        <i class="bi bi-trash fs-5"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="d-flex justify-content-center align-items-center gap-3 mt-5 pt-3 text-secondary">
                <a href="#" class="text-secondary text-decoration-none">&lt; Anterior</a>

                <div class="d-flex align-items-center gap-1">
                    <span class="bg-secondary bg-opacity-25 px-2 py-1 rounded text-dark fw-medium">1</span>
                    <a href="#" class="text-dark text-decoration-none px-2 py-1">2</a>
                    <a href="#" class="text-dark text-decoration-none px-2 py-1">3</a>
                    <span class="px-2 py-1">...</span>
                </div>

                <a href="#" class="text-secondary text-decoration-none">Siguiente &gt;</a>
            </div>

        </div>
    </main>
</div>

<!--Modal para nueva compra-->
<div class="modal fade" id="nuevaCompra" tabindex="-1" aria-hidden="true" th:data-abrir="${modalAbrir == 'nuevo'}">
    <div class="modal-dialog">
        <div class="modal-content">

            <form th:action="@{/compras/guardar}" method="post" th:object="${compra}">
                <div class="modal-header">
                    <h5 class="modal-title">Nueva compra</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <label class="form-label">Proveedor</label>
                    <select th:field="*{idProveedor}" class="form-select mb-3" required>
                        <option value="">Seleccionar proveedor</option>
                        <option th:each="p : ${proveedores}" th:value="${p.idProveedor}" th:text="${p.razonSocial}"></option>
                    </select>

                    <div class="mb-3">
                        <label for="idUsuario" class="form-label">Usuario responsable</label>
                        <select id="idUsuario" th:field="*{idUsuario}" class="form-select" required>
                            <option value="">Seleccione un usuario</option>
                            <option th:each="u : ${usuarios}" th:value="${u.idUsuario}" th:text="${u.nombres + ' ' + u.apellidos}"></option>
                        </select>
                        <div class="text-danger" th:if="${#fields.hasErrors('idUsuario')}" th:errors="*{idUsuario}"></div>
                    </div>

                    <label class="form-label">Tipo de comprobante</label>
                    <select th:field="*{tipoComprobante}" class="form-select mb-3" required>
                        <option value="">Seleccionar tipo</option>
                        <option value="FA">Factura</option>
                        <option value="BO">Boleta</option>
                    </select>

                    <label class="form-label">Número de comprobante</label>
                    <input type="text" th:field="*{numeroComprobante}" class="form-control mb-3" maxlength="50" required>

                    <label class="form-label">Total (S/)</label>
                    <input type="number" th:field="*{total}" class="form-control" min="0.01" step="0.01" required>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Registrar compra</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!--Editar compra-->
<div class="modal fade" id="editarCompra" tabindex="-1" aria-hidden="true" th:data-abrir="${modalAbrir == 'editar'}">
    <div class="modal-dialog">
        <div class="modal-content">
            <form th:action="@{/compras/guardar}" method="post" th:object="${compra}">
                <div class="modal-header">
                    <h5 class="modal-title">Editar compra</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" th:field="*{idCompra}">

                    <label class="form-label">Proveedor</label>
                    <select th:field="*{idProveedor}" class="form-select mb-3" required>
                        <option th:each="p : ${proveedores}" th:value="${p.idProveedor}" th:text="${p.razonSocial}">
                        </option>
                    </select>

                    <div class="mb-3">
                        <label for="idUsuario-edi" class="form-label">Usuario responsable</label>
                        <select id="idUsuario-edi" th:field="*{idUsuario}" class="form-select" required>
                            <option value="">Seleccione un usuario</option>
                            <option th:each="u : ${usuarios}" th:value="${u.idUsuario}" th:text="${u.nombres + ' ' + u.apellidos}"></option>
                        </select>
                        <div class="text-danger" th:if="${#fields.hasErrors('idUsuario')}" th:errors="*{idUsuario}"></div>
                    </div>

                    <label class="form-label">Tipo de comprobante</label>
                    <select th:field="*{tipoComprobante}" class="form-select mb-3" required>
                        <option value="FA">Factura</option>
                        <option value="BO">Boleta</option>
                    </select>

                    <label class="form-label">Número de comprobante</label>
                    <input type="text" th:field="*{numeroComprobante}" class="form-control mb-3" maxlength="50" required>

                    <label class="form-label">Total (S/)</label>
                    <input type="number" th:field="*{total}" class="form-control" min="0.01" step="0.01" required>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar cambios</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show" role="alert">
    <span th:text="${mensaje}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
</div>
<div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
    <span th:text="${error}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="/js/compras.js"></script>
</body>
</html>
