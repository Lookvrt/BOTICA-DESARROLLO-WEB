<!DOCTYPE html>
<html lang="es">
<head th:replace="~{fragment/head :: common-head('Iniciar Sesión')}">
</head>
<body class="bg-body d-flex align-items-center justify-content-center min-vh-100 m-0">
    <main class="bg-white p-4 rounded-3 shadow col-11 col-sm-8 col-md-5 col-lg-4">

    <h2 class="text-center mb-4 fs-2 fw-bold">Iniciar sesión</h2>
    <form th:action="@{/login}" method="post" class="row g-3">
        <!-- Token CSRF si aplica -->
        <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <!-- Mensajes de Error o Logout -->
        <div th:if="${errorMsg}" class="alert alert-danger py-2 col-12 mb-2" role="alert">
            <span th:text="${errorMsg}">Usuario o contraseña incorrectos.</span>
        </div>
        <div th:if="${logoutMsg}" class="alert alert-success py-2 col-12 mb-2" role="alert">
            <span th:text="${logoutMsg}">Sesión cerrada correctamente.</span>
        </div>

        <div class="col-12">
            <label for="usuario" class="form-label fw-semibold">Usuario o Correo</label>
            <input type="text" class="form-control" id="usuario" name="usuario" placeholder="Ej: admin o correo@ejemplo.com" required autofocus>
        </div>
        <div class="col-12">
            <label for="clave" class="form-label fw-semibold">Contraseña</label>
            <input type="password" class="form-control" id="clave" name="clave" placeholder="••••••••" required>
        </div>
        <div class="col-12 form-check ms-2">
            <input type="checkbox" id="remember-me" name="remember-me" class="form-check-input">
            <label for="remember-me" class="form-check-label text-muted">Recordar sesión</label>
        </div>
        <div class="col-12 mt-4">
            <button type="submit" class="btn btn-dark w-100 py-2 fw-semibold">Iniciar sesión</button>
        </div>
    </form>
    <div class="text-center mt-3">
        <a href="#" class="text-decoration-none small text-primary">¿Olvidaste tu contraseña?</a>
    </div>

    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
