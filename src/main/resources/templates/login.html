<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-body d-flex align-items-center justify-content-center min-vh-100 m-0">
    <main class="bg-white p-4 rounded-3 shadow col-11 col-sm-8 col-md-5 col-lg-4">

    <h2 class="text-center mb-4 fs-2 fw-bold">Iniciar sesión</h2>
    <form class="row g-3">
        <div class="col-12">
            <label for="Email" class="form-label">Usuario</label>
            <input type="email" class="form-control" id="Email" placeholder="correo@ejemplo.com">
        </div>
        <div class="col-12">
            <label for="Password" class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="Password">
        </div>
        <div class="col-12 form-check ms-2">
            <input type="checkbox" id="exampleCheck1" class="form-check-input">
            <label for="exampleCheck1" class="form-check-label">Recordar sesión</label>
        </div>
        <div class="col-12 mt-4">
            <button type="submit" class="btn btn-dark w-100 py-2">Iniciar sesión</button>
        </div>
    </form>
    <div class="text-center mt-3">
        <a href="#" class="text-decoration-none small text-primary">¿Olvidaste tu contraseña?</a>
    </div>

    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
