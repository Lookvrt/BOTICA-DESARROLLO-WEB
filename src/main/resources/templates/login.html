<!DOCTYPE html>
<html lang="es">
<head th:replace="~{fragment/head :: common-head('Iniciar Sesión')}">
</head>
<body class="bg-body d-flex align-items-center justify-content-center min-vh-100 m-0">
    <main class="bg-white p-4 rounded-3 shadow col-11 col-sm-8 col-md-5 col-lg-4">

    <h2 class="text-center mb-4 fs-2 fw-bold">Iniciar sesión</h2>
    <form th:action="@{/login}" method="post" class="row g-3">
        <!-- Token CSRF si aplica -->
        <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <!-- Mensajes de Error o Logout -->
        <div th:if="${errorMsg}" class="alert alert-danger py-2 col-12 mb-2" role="alert">
            <span th:text="${errorMsg}">Usuario o contraseña incorrectos.</span>
        </div>
        <div th:if="${logoutMsg}" class="alert alert-success py-2 col-12 mb-2" role="alert">
            <span th:text="${logoutMsg}">Sesión cerrada correctamente.</span>
        </div>

        <div class="col-12">
            <label for="usuario" class="form-label fw-semibold">Usuario o Correo</label>
            <input type="text" class="form-control" id="usuario" name="usuario" placeholder="Ej: admin o correo@ejemplo.com" required autofocus>
        </div>
        <div class="col-12">
            <label for="clave" class="form-label fw-semibold">Contraseña</label>
            <input type="password" class="form-control" id="clave" name="clave" placeholder="••••••••" required>
        </div>
        <div class="col-12 form-check ms-2">
            <input type="checkbox" id="remember-me" name="remember-me" class="form-check-input">
            <label for="remember-me" class="form-check-label text-muted">Recordar sesión</label>
        </div>
        <div class="col-12 mt-4">
            <button type="submit" class="btn btn-dark w-100 py-2 fw-semibold">Iniciar sesión</button>
        </div>
    </form>
    
    <!-- Separador -->
    <div class="d-flex align-items-center my-3">
        <hr class="flex-grow-1 border-secondary opacity-25">
        <span class="px-2 text-muted small fw-medium">o continúa con</span>
        <hr class="flex-grow-1 border-secondary opacity-25">
    </div>

    <!-- Botón de Login con Google -->
    <a th:href="@{/oauth2/authorization/google}" class="btn btn-outline-secondary w-100 py-2 fw-semibold d-flex align-items-center justify-content-center gap-2 shadow-sm text-dark bg-white border">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 48 48">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            <path fill="none" d="M0 0h48v48H0z"/>
        </svg>
        <span>Continuar con Google</span>
    </a>

    <div class="text-center mt-3">
        <a href="#" class="text-decoration-none small text-primary">¿Olvidaste tu contraseña?</a>
    </div>

    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
