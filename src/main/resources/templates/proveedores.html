<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragment/head :: common-head('Proveedores - Ahorro y Salud')}">
</head>
<body class="bg-light">

<div class="d-flex">
    <div th:replace="~{fragment/sidebar :: sidebar('proveedores')}"></div>

    <main class="flex-grow-1 p-4 overflow-auto min-vh-100">

        <h3 class="mb-4 fw-semibold">Proveedores</h3>

        <div class="card border border-light-subtle p-4 shadow-sm bg-white rounded-3">

            <div class="d-flex justify-content-between align-items-center mb-3">
                <span class="fw-medium fs-5" th:text="|${#lists.size(proveedores)} proveedores|">0 proveedores</span>
                <button class="btn btn-light bg-white border px-3 fw-medium text-dark" data-bs-toggle="modal" data-bs-target="#modalProveedor">
                    + Nuevo
                </button>
            </div>

            <div class="row g-2 mb-3 pb-3 border-bottom">
                <div class="col-12 col-md-6 col-lg-5">
                    <div class="input-group">
                        <span class="input-group-text bg-white text-muted border-end-0" id="search-prov">
                            <i class="bi bi-search"></i>
                        </span>
                        <input type="text" class="form-control border-start-0 ps-0 shadow-none" placeholder="Busca por razón social o ID..." aria-label="Buscar proveedor" aria-describedby="search-prov">
                    </div>
                </div>
            </div>

            <div class="table-responsive min-vh-50">
                <table class="table align-middle table-borderless table-hover">
                    <thead class="border-bottom">
                    <tr class="text-dark fw-semibold">
                        <th class="py-3">ID</th>
                        <th class="py-3">Razón Social</th>
                        <th class="py-3">Correo</th>
                        <th class="py-3">Teléfono</th>
                        <th class="py-3">Dirección</th>
                        <th class="py-3 text-center">Estado</th>
                        <th class="py-3"></th>
                    </tr>
                    </thead>
                    <tbody>
                        <tr th:each="p : ${proveedores}" class="border-bottom">

                            <td class="py-3" th:text="${p.idProveedor}"></td>
                            <td th:text="${p.razonSocial}"></td>
                            <td th:text="${p.correo}"></td>
                            <td th:text="${p.telefono}"></td>
                            <td class="text-truncate" style="max-width: 200px;"
                                th:text="${p.direccion}"></td>

                            <td class="text-center">
                            <span th:if="${p.estado == 1}"
                                  class="badge bg-success bg-opacity-25 text-success
                                         px-3 py-2 rounded-pill fw-medium">
                                Activo
                            </span>

                            <span th:if="${p.estado == 0}"
                                      class="badge bg-danger bg-opacity-25 text-danger
                             px-3 py-2 rounded-pill fw-medium">Inactivo</span>
                            </td>

                            <td class="text-end">
                                <a th:href="@{/proveedores/editar/{id}(id=${p.idProveedor})}"
                                   class="btn btn-warning btn-sm">
                                    <i class="bi bi-pencil"></i>
                                </a>

                                <form th:action="@{/proveedores/eliminar/{id}(id=${p.idProveedor})}"
                                      method="post"
                                      style="display: inline;"
                                      onsubmit="return confirm('¿Estás seguro de eliminar este proveedor?');">

                                    <button type="submit" class="btn btn-danger btn-sm">
                                        <i class="bi bi-trash"></i>
                                    </button>

                                </form>
                            </td>

                        </tr>

                        <tr th:if="${#lists.isEmpty(proveedores)}">
                            <td colspan="7" class="text-center py-4 text-secondary">
                                No hay proveedores registrados.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="d-flex justify-content-center align-items-center gap-3 mt-5 pt-3 text-secondary">
                <a href="#" class="text-secondary text-decoration-none">&lt; Anterior</a>

                <div class="d-flex align-items-center gap-1">
                    <span class="bg-secondary bg-opacity-25 px-2 py-1 rounded text-dark fw-medium">1</span>
                    <a href="#" class="text-dark text-decoration-none px-2 py-1">2</a>
                    <a href="#" class="text-dark text-decoration-none px-2 py-1">3</a>
                    <span class="px-2 py-1">...</span>
                </div>

                <a href="#" class="text-secondary text-decoration-none">Siguiente &gt;</a>
            </div>

        </div>
    </main>
</div>

<!--Modal nuevo-->
<div class="modal fade" id="modalProveedor" tabindex="-1"
     aria-labelledby="tituloProveedor" aria-hidden="true"
     th:data-abrir="${modalAbrir == 'nuevo'}">

    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title" id="tituloProveedor">
                    Registrar proveedor
                </h5>

                <button type="button" class="btn-close"
                        data-bs-dismiss="modal" aria-label="Cerrar">
                </button>
            </div>

            <div class="modal-body">

                <form th:action="@{/proveedores/guardar}"
                      method="post"
                      th:object="${proveedor}">

                    <div class="row g-3">

                        <div class="col-12">
                            <label for="razonSocial" class="form-label">
                                Razón Social
                            </label>
                            <input type="text" class="form-control"
                                   id="razonSocial"
                                   th:field="*{razonSocial}"
                                   maxlength="150" required>

                            <div class="text-danger"
                                 th:if="${#fields.hasErrors('razonSocial')}"
                                 th:errors="*{razonSocial}">
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label for="ruc" class="form-label">RUC</label>
                            <input type="text" class="form-control"
                                   id="ruc" th:field="*{ruc}"
                                   minlength="11" maxlength="11"
                                   pattern="[0-9]{11}"
                                   title="Ingrese exactamente 11 dígitos">
                            <div class="text-danger"
                                 th:if="${#fields.hasErrors('ruc')}"
                                 th:errors="*{ruc}">
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label for="correo" class="form-label">Correo</label>
                            <input type="email" class="form-control"
                                   id="correo" th:field="*{correo}"
                                   maxlength="100">
                            <div class="text-danger"
                                 th:if="${#fields.hasErrors('correo')}"
                                 th:errors="*{correo}">
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label for="telefono" class="form-label">Teléfono</label>
                            <input type="tel" class="form-control"
                                   id="telefono" th:field="*{telefono}"
                                   maxlength="20">
                        </div>

                        <div class="col-md-6">
                            <label for="estado" class="form-label">Estado</label>
                            <select class="form-select" id="estado"
                                    th:field="*{estado}" required>
                                <option value="1">Activo</option>
                                <option value="0">Inactivo</option>
                            </select>
                        </div>

                        <div class="col-12">
                            <label for="direccion" class="form-label">
                                Dirección
                            </label>
                            <input type="text" class="form-control"
                                   id="direccion" th:field="*{direccion}"
                                   maxlength="200">
                        </div>

                    </div>

                    <div class="modal-footer px-0 pb-0 mt-4">
                        <button type="button" class="btn btn-light"
                                data-bs-dismiss="modal">
                            Cancelar
                        </button>

                        <button type="submit" class="btn btn-primary">
                            Registrar proveedor
                        </button>
                    </div>
                </form>

            </div>
        </div>
    </div>
</div>

<!--Modal para editar-->
<div class="modal fade" id="editarProveedor" tabindex="-1" aria-hidden="true" th:data-abrir="${modalAbrir == 'editar'}">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">

            <form th:action="@{/proveedores/guardar}"
                  method="post"
                  th:object="${proveedor}">

                <div class="modal-header">
                    <h5 class="modal-title">Editar proveedor</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>

                <div class="modal-body">

                    <input type="hidden" th:field="*{idProveedor}">

                    <div class="row g-3">
                        <div class="col-12">
                            <label class="form-label">Razón social</label>
                            <input type="text" th:field="*{razonSocial}" class="form-control" maxlength="150" required>
                            <div class="text-danger" th:if="${#fields.hasErrors('razonSocial')}" th:errors="*{razonSocial}"></div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">RUC</label>
                            <input type="text" th:field="*{ruc}" class="form-control" maxlength="11" pattern="[0-9]{11}" title="11 dígitos numéricos">
                            <div class="text-danger" th:if="${#fields.hasErrors('ruc')}" th:errors="*{ruc}"></div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Teléfono</label>
                            <input type="tel" th:field="*{telefono}" class="form-control" maxlength="20">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Correo</label>
                            <input type="email" th:field="*{correo}" class="form-control" maxlength="100">
                            <div class="text-danger" th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}"></div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Estado</label>
                            <select th:field="*{estado}" id="estado-editado" class="form-select" required>
                                <option value="1">Activo</option>
                                <option value="0">Inactivo</option>
                            </select>
                        </div>

                        <div class="col-12">
                            <label class="form-label">Dirección</label>
                            <input type="text" th:field="*{direccion}" class="form-control" maxlength="200">
                        </div>
                    </div>

                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar cambios</button>
                </div>

            </form>

        </div>
    </div>
</div>

<div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show" role="alert">
    <span th:text="${mensaje}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
</div>

<div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
    <span th:text="${error}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="/js/proveedores.js"></script>
</body>
</html>
