<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragment/head :: common-head('Verificar Código')}"></th:block>
    <link rel="stylesheet" th:href="@{/css/verificar-otp.css}">
</head>
<body>
<div class="otp-card">
    <!-- Icono -->
    <div class="text-center mb-3">
        <div class="shield-icon">🛡️</div>
        <h4 class="fw-bold mt-2 mb-1">Verificación en dos pasos</h4>
        <p class="text-muted-light small mb-0">
            Enviamos un código de 6 dígitos a<br>
            <span class="text-white fw-semibold" th:text="${emailMasked}">us****@gmail.com</span>
        </p>
    </div>

    <!-- Alertas -->
    <div th:if="${errorMsg}" class="alert-error mb-3" th:text="${errorMsg}"></div>
    <div th:if="${reenvioMsg}" class="alert-success mb-3" th:text="${reenvioMsg}"></div>

    <!-- Formulario OTP -->
    <form id="otp-form" th:action="@{/verificar-otp}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <!-- 6 cajas individuales de entrada -->
        <div class="otp-inputs">
            <input class="otp-box" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" id="d1" autofocus/>
            <input class="otp-box" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" id="d2"/>
            <input class="otp-box" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" id="d3"/>
            <input class="otp-box" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" id="d4"/>
            <input class="otp-box" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" id="d5"/>
            <input class="otp-box" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" id="d6"/>
        </div>

        <!-- Campo oculto que recibe el código completo -->
        <input type="text" name="codigo" id="codigo-hidden"/>

        <button type="submit" class="btn-verify" id="btn-verificar">Verificar código</button>
    </form>

    <!-- Reenviar OTP -->
    <form th:action="@{/reenviar-otp}" method="post" class="text-center mt-3">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <span class="text-muted-light small">¿No llegó el código? </span>
        <button type="submit" class="resend-link border-0 bg-transparent p-0">Reenviar</button>
    </form>

    <div class="text-center mt-4">
        <a href="/login" class="text-muted-light small text-decoration-none">← Volver al inicio de sesión</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
<script th:src="@{/js/verificar-otp.js}"></script>
</body>
</html>
