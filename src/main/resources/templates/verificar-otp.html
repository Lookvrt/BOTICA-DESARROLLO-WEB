<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragment/head :: common-head('Verificar Código')}">
</head>
<style>
    body {
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Inter', sans-serif;
    }
    .otp-card {
        background: rgba(255,255,255,0.05);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 20px;
        padding: 2.5rem;
        max-width: 420px;
        width: 100%;
        color: white;
        box-shadow: 0 25px 50px rgba(0,0,0,0.4);
    }
    .shield-icon {
        font-size: 3rem;
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }
    .otp-inputs {
        display: flex;
        gap: 10px;
        justify-content: center;
        margin: 1.5rem 0;
    }
    .otp-inputs input {
        width: 50px;
        height: 60px;
        font-size: 1.6rem;
        text-align: center;
        border: 2px solid rgba(255,255,255,0.2);
        border-radius: 12px;
        background: rgba(255,255,255,0.07);
        color: white;
        font-weight: bold;
        transition: border-color 0.2s, box-shadow 0.2s;
        outline: none;
    }
    .otp-inputs input:focus {
        border-color: #6366f1;
        box-shadow: 0 0 0 3px rgba(99,102,241,0.3);
    }
    .btn-verify {
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        border: none;
        border-radius: 12px;
        color: white;
        font-weight: 600;
        padding: 14px;
        width: 100%;
        font-size: 1rem;
        cursor: pointer;
        transition: opacity 0.2s, transform 0.1s;
    }
    .btn-verify:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-verify:active { transform: translateY(0); }
    .resend-link { color: #818cf8; cursor: pointer; text-decoration: underline; font-size: 0.875rem; }
    .alert-error {
        background: rgba(239,68,68,0.15);
        border: 1px solid rgba(239,68,68,0.4);
        color: #fca5a5;
        border-radius: 10px;
        padding: 10px 14px;
        font-size: 0.875rem;
    }
    .alert-success {
        background: rgba(34,197,94,0.15);
        border: 1px solid rgba(34,197,94,0.4);
        color: #86efac;
        border-radius: 10px;
        padding: 10px 14px;
        font-size: 0.875rem;
    }
    #codigo-hidden { display: none; }
    .text-muted-light { color: rgba(255,255,255,0.5); }
</style>
<body>
<div class="otp-card">
    <!-- Icono -->
    <div class="text-center mb-3">
        <div class="shield-icon">🛡️</div>
        <h4 class="fw-bold mt-2 mb-1">Verificación en dos pasos</h4>
        <p class="text-muted-light small mb-0">
            Enviamos un código de 6 dígitos a<br>
            <span class="text-white fw-semibold" th:text="${emailMasked}">us****@gmail.com</span>
        </p>
    </div>

    <!-- Alertas -->
    <div th:if="${errorMsg}" class="alert-error mb-3" th:text="${errorMsg}"></div>
    <div th:if="${reenvioMsg}" class="alert-success mb-3" th:text="${reenvioMsg}"></div>

    <!-- Formulario OTP -->
    <form id="otp-form" th:action="@{/verificar-otp}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <!-- 6 cajas individuales de entrada -->
        <div class="otp-inputs">
            <input class="otp-box" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" id="d1" autofocus/>
            <input class="otp-box" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" id="d2"/>
            <input class="otp-box" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" id="d3"/>
            <input class="otp-box" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" id="d4"/>
            <input class="otp-box" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" id="d5"/>
            <input class="otp-box" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" id="d6"/>
        </div>

        <!-- Campo oculto que recibe el código completo -->
        <input type="text" name="codigo" id="codigo-hidden"/>

        <button type="submit" class="btn-verify" id="btn-verificar">Verificar código</button>
    </form>

    <!-- Reenviar OTP -->
    <form th:action="@{/reenviar-otp}" method="post" class="text-center mt-3">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <span class="text-muted-light small">¿No llegó el código? </span>
        <button type="submit" class="resend-link border-0 bg-transparent p-0">Reenviar</button>
    </form>

    <div class="text-center mt-4">
        <a href="/login" class="text-muted-light small text-decoration-none">← Volver al inicio de sesión</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
<script>
    // Auto-avanza entre cajas y compila el código al enviar
    const boxes = document.querySelectorAll('.otp-box');
    const hidden = document.getElementById('codigo-hidden');
    const form   = document.getElementById('otp-form');

    boxes.forEach((box, i) => {
        box.addEventListener('input', () => {
            box.value = box.value.replace(/[^0-9]/g, '');
            if (box.value && i < boxes.length - 1) boxes[i + 1].focus();
        });
        box.addEventListener('keydown', (e) => {
            if (e.key === 'Backspace' && !box.value && i > 0) boxes[i - 1].focus();
        });
        // Pegar código de 6 dígitos de una vez
        box.addEventListener('paste', (e) => {
            e.preventDefault();
            const pasted = e.clipboardData.getData('text').replace(/\D/g, '').slice(0, 6);
            boxes.forEach((b, idx) => { b.value = pasted[idx] || ''; });
            boxes[Math.min(pasted.length, 5)].focus();
        });
    });

    form.addEventListener('submit', (e) => {
        const code = Array.from(boxes).map(b => b.value).join('');
        if (code.length !== 6) {
            e.preventDefault();
            alert('Ingresa los 6 dígitos del código.');
            return;
        }
        hidden.value = code;
    });
</script>
</body>
</html>
