<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario - Ahorro y Salud</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="d-flex">
    <div th:replace="~{fragment/sidebar :: sidebar('inventario')}"></div>

    <main class="flex-grow-1 p-4 overflow-auto min-vh-100">

        <h3 class="mb-4 fw-semibold">Inventario</h3>

        <div class="card border border-light-subtle p-4 shadow-sm bg-white rounded-3">

            <div class="d-flex justify-content-between align-items-center mb-3">
                <span class="fw-medium fs-5">339 productos</span>
                <button class="btn btn-light bg-white border px-3 fw-medium text-dark">
                    + Nuevo
                </button>
            </div>

            <div class="row g-2 mb-3 pb-3 border-bottom">
                <div class="col-12 col-md-6 col-lg-4">
                    <div class="input-group">
                        <span class="input-group-text bg-white text-muted border-end-0" id="search-inventario">
                            <i class="bi bi-search"></i>
                        </span>
                        <input type="text" class="form-control border-start-0 ps-0 shadow-none" placeholder="Busca tus ventas..." aria-label="Buscar inventario" aria-describedby="search-inventario">
                    </div>
                </div>

                <div class="col-auto">
                    <button class="btn bg-secondary bg-opacity-10 border-0 text-dark d-flex align-items-center gap-2 px-3 fw-medium">
                        <i class="bi bi-filter"></i> Filtrar
                    </button>
                </div>
            </div>

            <div class="table-responsive min-vh-50">
                <table class="table align-middle table-borderless table-hover">
                    <thead class="border-bottom">
                    <tr class="text-dark fw-semibold">
                        <th class="py-3">Codigo</th>
                        <th class="py-3">Nombre</th>
                        <th class="py-3">P. activo</th>
                        <th class="py-3 text-center">Stock</th>
                        <th class="py-3 text-center">P. venta</th>
                        <th class="py-3">Estado</th>
                        <th class="py-3"></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr class="border-bottom">
                        <td class="py-3">MED001</td>
                        <td>Paracetamol 500mg x10</td>
                        <td>Paracetamol</td>
                        <td class="text-center">120</td>
                        <td class="text-center">2.50</td>
                        <td class="text-center">
                            <span class="badge bg-success bg-opacity-25 text-success px-3 py-2 rounded-pill fw-medium">Activo</span>
                        </td>
                        <td class="text-end">
                            <button class="btn btn-link text-dark p-1 text-decoration-none me-2">
                                <i class="bi bi-pencil fs-5"></i>
                            </button>
                            <button class="btn btn-link text-dark p-1 text-decoration-none">
                                <i class="bi bi-trash fs-5"></i>
                            </button>
                        </td>
                    </tr>
                    <tr class="border-bottom">
                        <td class="py-3">MED002</td>
                        <td>Amoxicilina 500mg x12</td>
                        <td>Amoxicilina</td>
                        <td class="text-center">5</td>
                        <td class="text-center">12.00</td>
                        <td class="text-center">
                            <span class="badge bg-warning bg-opacity-25 text-warning px-3 py-2 rounded-pill fw-medium">Critico</span>
                        </td>
                        <td class="text-end">
                            <button class="btn btn-link text-dark p-1 text-decoration-none me-2">
                                <i class="bi bi-pencil fs-5"></i>
                            </button>
                            <button class="btn btn-link text-dark p-1 text-decoration-none">
                                <i class="bi bi-trash fs-5"></i>
                            </button>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div class="d-flex justify-content-center align-items-center gap-3 mt-5 pt-3 text-secondary">
                <a href="#" class="text-secondary text-decoration-none">&lt; Anterior</a>

                <div class="d-flex align-items-center gap-1">
                    <span class="bg-secondary bg-opacity-25 px-2 py-1 rounded text-dark fw-medium">1</span>
                    <a href="#" class="text-dark text-decoration-none px-2 py-1">2</a>
                    <a href="#" class="text-dark text-decoration-none px-2 py-1">3</a>
                    <span class="px-2 py-1">...</span>
                </div>

                <a href="#" class="text-secondary text-decoration-none">Siguiente &gt;</a>
            </div>

        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
