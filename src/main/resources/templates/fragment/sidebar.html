<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>
<body>
<div th:fragment="sidebar(activeTab)" class="d-flex flex-column flex-shrink-0 p-3 text-white bg-primary min-vh-100 sidebar-width" style="width: 260px;">

    <a href="/" class="d-flex align-items-center mb-3 text-white text-decoration-none justify-content-center w-100">
        <div class="bg-white rounded-circle p-3 d-flex align-items-center justify-content-center">
            <i class="bi bi-capsule-pill text-primary display-6 lh-1"></i>
        </div>
    </a>

    <hr class="my-3">

    <ul class="nav nav-pills flex-column mb-auto">
        <li class="nav-item mb-1">
            <a th:href="@{/dashboard}"
               class="nav-link"
               th:classappend="${activeTab == 'dashboard'} ? 'active bg-light text-primary fw-bold' : 'text-white'">
                <i class="bi bi-speedometer2 me-2"></i> Dashboard
            </a>
        </li>
        <li class="nav-item mb-1">
            <a th:href="@{/venta}"
               class="nav-link"
               th:classappend="${activeTab == 'venta'} ? 'active bg-light text-primary fw-bold' : 'text-white'">
                <i class="bi bi-cart-check me-2"></i> Punto de Venta
            </a>
        </li>
        <li class="nav-item mb-1">
            <a th:href="@{/compras}"
               class="nav-link"
               th:classappend="${activeTab == 'compras'} ? 'active bg-light text-primary fw-bold' : 'text-white'">
                <i class="bi bi-bag me-2"></i> Compras
            </a>
        </li>
        <li class="nav-item mb-1">
            <a th:href="@{/inventario}"
               class="nav-link"
               th:classappend="${activeTab == 'inventario'} ? 'active bg-light text-primary fw-bold' : 'text-white'">
                <i class="bi bi-box-seam me-2"></i> Inventario
            </a>
        </li>
        <li class="nav-item mb-1">
            <a th:href="@{/proveedores}"
               class="nav-link"
               th:classappend="${activeTab == 'proveedores'} ? 'active bg-light text-primary fw-bold' : 'text-white'">
                <i class="bi bi-truck me-2"></i> Proveedores
            </a>
        </li>
        <li class="nav-item mb-1">
            <a th:href="@{/usuarios}"
               class="nav-link"
               th:classappend="${activeTab == 'usuarios'} ? 'active bg-light text-primary fw-bold' : 'text-white'">
                <i class="bi bi-people me-2"></i> Usuarios
            </a>
        </li>
        <li class="nav-item mb-1">
            <a th:href="@{/reporte}"
               class="nav-link"
               th:classappend="${activeTab == 'reporte'} ? 'active bg-light text-primary fw-bold' : 'text-white'">
                <i class="bi bi-file-earmark-bar-graph me-2"></i> Reporte
            </a>
        </li>
        <li class="nav-item mb-1">
            <a th:href="@{/alertas}"
               class="nav-link"
               th:classappend="${activeTab == 'alertas'} ? 'active bg-light text-primary fw-bold' : 'text-white'">
                <i class="bi bi-bell me-2"></i> Alertas
            </a>
        </li>
    </ul>

    <div class="d-flex align-items-center justify-content-between px-2">
        <div class="d-flex align-items-center gap-2 overflow-hidden me-2">
            <i class="bi bi-person-circle fs-4 flex-shrink-0"></i>
            <span class="fw-bold fs-6 text-truncate">Usuario</span>
        </div>
        <a th:href="@{/}" class="btn btn-outline-light btn-sm d-flex align-items-center gap-1 flex-shrink-0" title="Cerrar sesión">
            <i class="bi bi-box-arrow-right"></i>
            <span>Salir</span>
        </a>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
