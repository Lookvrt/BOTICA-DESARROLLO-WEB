spring.application.name=BOTICA-DESARROLLO-WEB
server.port=8080

# Configuración de base de datos
spring.datasource.url=jdbc:mysql://localhost:3306/botica_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Mostrar valores reales en las consultas SQL
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Deshabilitar la caché de plantillas (Thymeleaf)
spring.thymeleaf.cache=false

# Límites para subida de archivos
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Formato global de fechas en JSON
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=UTC