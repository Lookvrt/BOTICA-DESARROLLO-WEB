spring.application.name=BOTICA-DESARROLLO-WEB
server.port=${PORT:8080}

# Cargar perfil local si existe (application-local.properties)
spring.profiles.active=local

# ─────────────────────────────────────────────────────────
# BASE DE DATOS — AIVEN MySQL (cloud)
# ─────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:mysql://botica-mysql-3030c265-duck-7a64.a.aivencloud.com:19911/defaultdb?ssl-mode=REQUIRED&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:avnadmin}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─────────────────────────────────────────────────────────
# JPA / Hibernate
# ─────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Mostrar valores reales en consultas SQL
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ─────────────────────────────────────────────────────────
# THYMELEAF
# ─────────────────────────────────────────────────────────
spring.thymeleaf.cache=false

# ─────────────────────────────────────────────────────────
# SUBIDA DE ARCHIVOS
# ─────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ─────────────────────────────────────────────────────────
# FORMATO DE FECHAS JSON
# ─────────────────────────────────────────────────────────
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=UTC

# ─────────────────────────────────────────────────────────
# MAILTRAP — Envío de OTP por email (sandbox gratuito)
# Obtén tus credenciales en: mailtrap.io → Email Testing → SMTP Settings
# ─────────────────────────────────────────────────────────
spring.mail.host=${MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME:34bf09fce3c127}
spring.mail.password=${MAIL_PASSWORD:}
app.mail.from=seguridad@botica.com
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=sandbox.smtp.mailtrap.io
spring.mail.properties.mail.debug=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ─────────────────────────────────────────────────────────
# GOOGLE OAUTH2 (Login con Google)
# ─────────────────────────────────────────────────────────
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# ─────────────────────────────────────────────────────────
# SEGURIDAD / 2FA (Doble Autenticación)
# Cambiar a true cuando deseen volver a activar el envío y pedido de códigos OTP
# ─────────────────────────────────────────────────────────
app.security.2fa.enabled=false